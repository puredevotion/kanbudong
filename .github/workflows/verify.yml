name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm

      # The web subset. There is no native app: the Expo scaffold did not come
      # across in the fork, because the product is a PWA.
      - run: pnpm install:web --frozen-lockfile

      - run: pnpm -r --filter @kanbudong/engine --filter @kanbudong/net --filter @kanbudong/pwa typecheck

      - run: pnpm test

      - run: pnpm build
